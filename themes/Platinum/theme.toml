[meta]
name = "Platinum"
author = "Sagrado"
version = "1.0"
description = "Classic Platinum-inspired cool gray skin with Aqua accents"

[colors]
text = "#111111"
primary_light = "#ffffff"
primary_background = "#d0d0d0"
primary_dark = "#747474"
primary_frame = "#707070"
selection = "#3b78c5"
selection_text = "#ffffff"
text_box_background = "#ffffff"
menu_background = "#eeeeee"
menu_text = "#111111"
alert = "#c94f4f"
alert_text = "#ffffff"

[slot.button]
image = "images/button-normal.png"
caps = [3, 3, 3, 3]

[slot.default_button]
image = "images/default_button-normal.png"
caps = [3, 3, 3, 3]

[slot.popup_button]
image = "images/popup_button-normal.png"
caps = [3, 3, 3, 3]

[slot.tick_blank]
image = "images/tick_blank-normal.png"
caps = [2, 2, 2, 2]

[slot.tick_ticked]
image = "images/tick_ticked-normal.png"
caps = [2, 2, 2, 2]

[slot.mutex_blank]
image = "images/mutex_blank-normal.png"
caps = [2, 2, 2, 2]

[slot.mutex_ticked]
image = "images/mutex_ticked-normal.png"
caps = [2, 2, 2, 2]

[slot.text_box]
image = "images/text_box-normal.png"
